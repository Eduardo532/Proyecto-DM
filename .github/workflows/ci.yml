name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python ../.github/scripts/run.py ruff ruff check --output-format=concise .

      - name: Tipos (mypy)
        run: python ../.github/scripts/run.py mypy mypy app

      - name: Pruebas (pytest)
        run: python ../.github/scripts/run.py pytest pytest -q -p no:cacheprovider --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: python3 ../.github/scripts/run.py npm npm install --no-audit --no-fund --legacy-peer-deps

      - name: Tipos (tsc)
        run: python3 ../.github/scripts/run.py tsc npm run typecheck

      - name: Pruebas (vitest)
        run: python3 ../.github/scripts/run.py vitest npm test

      - name: Compilar (vite)
        run: python3 ../.github/scripts/run.py vite npm run build
