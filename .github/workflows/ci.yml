name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generar migración (temporal)
        if: runner.os == 'Linux'
        env:
          VDM_DATA_DIR: /tmp/vdm-gen
        run: |
          mkdir -p /tmp/vdm-gen
          alembic upgrade head
          alembic revision --autogenerate -m "modelo de juego" --rev-id 0002
          python ../.github/scripts/emit.py "alembic/versions/0002_*.py"

      - name: Lint (ruff)
        run: python ../.github/scripts/run.py ruff ruff check --output-format=concise .

      - name: Tipos (mypy)
        run: python ../.github/scripts/run.py mypy mypy app

      - name: Pruebas (pytest)
        run: python ../.github/scripts/run.py pytest pytest -q -p no:cacheprovider --tb=short
